<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Compulsory Purchase</title>
    <link rel="icon" type="image/png" href="TemplateData/icon-180.png">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <style>
      /* The launch screen: plain paper, no logo and no title, with only a thin rule that fills while the game loads. */
      html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden; background: #EDE3C8; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #EDE3C8; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; width: 180px; height: 3px; margin: -2px 0 0 -90px; background: rgba(26, 26, 23, .18); }
      #loading-bar { width: 0; height: 100%; background: #1A1A17; }
      #warning { position: fixed; left: 0; right: 0; top: 0; font: 14px sans-serif; text-align: center; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"></div></div>
    <div id="warning"></div>
    <script src="Build/f7db11f51dcf1042202d3cded4833d44.loader.js"></script>
    <script>
      // A message from the engine: an error stays, anything else goes after a few seconds.
      function showBanner(msg, type) {
        var box = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "#B3261E; color: #EDE3C8" : "#1A1A17; color: #EDE3C8");
        box.appendChild(div);
        box.style.display = "block";
        if (type != "error") setTimeout(function () { box.removeChild(div); if (!box.children.length) box.style.display = "none"; }, 5000);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/3edb0f6da9751826b1a95d17107b733e.data.unityweb",
        frameworkUrl: "Build/a476ace3e595ebe166eb2548274632e6.framework.js.unityweb",
        codeUrl: "Build/734dc94c7d455e54772aef7a52367589.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Woolyback LLC",
        productName: "Compulsory Purchase",
        productVersion: "1.0",
        showBanner: showBanner,
      }, function (progress) {
        document.querySelector("#loading-bar").style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
